[package]
name = "dm-ui"
description = "DeskMason 的 cxx-qt 桥：把 Rust 模型暴露给 QML"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
dm-core = { path = "../dm-core" }
dm-platform = { path = "../dm-platform" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json = { workspace = true }
chrono = { version = "0.4" }

[build-dependencies]
cxx-qt-build = "0.10"
